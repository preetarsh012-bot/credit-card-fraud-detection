<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Credit Card Fraud Detection</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #243b55;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            background: #f1f1f1;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💳 Fraud Detection</h1>

    <p class="subtitle">
        Credit Card Transaction Analyzer
    </p>

    <form action="/predict" method="POST">

        <label for="time">Transaction Time</label>

        <input
            type="number"
            step="any"
            id="time"
            name="time"
            placeholder="Enter transaction time"
            required
        >

        <label for="amount">Transaction Amount</label>

        <input
            type="number"
            step="any"
            id="amount"
            name="amount"
            placeholder="Enter transaction amount"
            required
        >

        <button type="submit">
            Check Transaction
        </button>

    </form>

    {% if prediction %}

    <div class="result">
        {{ prediction }}
    </div>

    {% endif %}

</div>

</body>
</html>
